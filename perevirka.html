<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Перевірка реквізитів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Перевірка реквізитів</h1>
      <div class="s2" id="who"></div>
    </div>
    <div class="tools noprint">
      <button class="btn ico" id="copy" aria-label="Копіювати текст"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
      <button class="btn ico" id="down" aria-label="Завантажити файл"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="btn ico" id="print" aria-label="Друк або PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg></button>
      <label class="btn ico" for="open" aria-label="Відкрити файл реквізитів"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></label>
      <input type="file" id="open" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="out"></div>

  <div class="bar noprint">
    <a class="btn" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Виправити</a>
    <span class="hint" id="when"></span>
    <button class="btn pri" id="send" hidden>Надіслати <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</main>

<script src="config.js"></script>
<script src="rekvizyty.js"></script>
<script>
const $ = id => document.getElementById(id);
let d = load();
const has = () => !!(d.name || d.code || d.iban);
if (canSend()) document.querySelector('label[for="open"]').hidden = true;

function render() {
  if (!has()) {
    $('who').textContent = '';
    $('when').textContent = '';
    $('out').innerHTML = `<section class="card empty"><h2>Реквізитів ще немає</h2><p class="s2">Заповніть форму або відкрийте файл реквізитів, який надіслав орендар.</p><a class="btn pri" href="index.html">Заповнити <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></section>`;
    $('send').hidden = true;
    return;
  }
  $('send').hidden = !canSend();
  const pr = problems(d);
  $('who').textContent = d.name || 'Орендар';
  $('when').textContent = d.savedAt ? 'Збережено ' + new Date(d.savedAt).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const state = pr.length
    ? `<div class="state miss">Уточнити: ${pr.map(r => r[0].toLowerCase()).join(', ')}</div>`
    : `<div class="state ok">Усі поля заповнені${d.agree ? '' : ' · згоди на обробку даних немає'}</div>`;
  const tr = rows(d).map(([l, v, need, ok, cls]) => {
    const s = String(v || '').trim();
    const cell = !s ? (need ? '<span class="mk">уточнити</span>' : '<span class="s2">—</span>')
      : ok === false ? `${esc(s)} <span class="mk">перевірити</span>` : esc(s);
    return `<tr><td>${l}</td><td class="${cls || ''}">${cell}</td></tr>`;
  }).join('');
  $('out').innerHTML = `${state}
    <section class="card"><h2>Реквізити</h2><table class="rq"><tbody>${tr}</tbody></table></section>
    <section class="card"><h2>Як буде в договорі</h2><div class="doc">${esc(contractText(d)).replace(/\n/g, '<br>')}</div></section>`;
}

function fileName() {
  const n = (d.name || 'orendar').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 40);
  return `rekvizyty-${n}.json`;
}

$('copy').onclick = async () => {
  if (!has()) return toast('Немає що копіювати');
  try { await navigator.clipboard.writeText(contractText(d)); toast('Скопійовано'); }
  catch (e) { toast('Не вдалося скопіювати'); }
};
$('down').onclick = () => {
  if (!has()) return toast('Немає що завантажувати');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
  a.download = fileName();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('send').onclick = async () => {
  const pr = problems(d);
  if (pr.length) return toast('Уточніть: ' + pr.map(r => r[0].toLowerCase()).join(', '));
  if (!d.agree) return toast('Потрібна згода на обробку даних — поставте її на формі');
  let txt;
  try { txt = await seal(d); } catch (e) { return toast('Не вдалося зашифрувати. Спробуйте інший браузер'); }
  if (FORMA.endpoint) {
    const b = $('send');
    b.disabled = true; b.firstChild.textContent = 'Надсилаю… ';
    try {
      await post(txt);
      forget();
      document.querySelector('.tools').hidden = true;
      document.querySelector('.bar').hidden = true;
      $('who').textContent = '';
      $('out').innerHTML = `<section class="card empty"><h2>Дякуємо!</h2><p class="s2">Реквізити надіслано. Договір підготуємо й надішлемо вам на підпис.</p></section>`;
      return;
    } catch (e) {
      b.disabled = false; b.firstChild.textContent = 'Надіслати ';
      toast('Не вдалося надіслати — надішліть текст самі');
    }
  }
  forget();
  const msg = 'Реквізити для договору оренди (зашифровано)\n\n' + txt;
  const subj = 'Реквізити орендаря' + (d.name ? ' · ' + d.name : '');
  document.querySelector('.tools').hidden = true;
  document.querySelector('.bar').hidden = true;
  $('who').textContent = '';
  $('out').innerHTML = `<section class="card"><h2>Залишився один крок</h2>
    <p class="s2">Реквізити зашифровано. Надішліть цей текст нам — прочитати його можемо лише ми.</p>
    <div class="sealed num">${esc(txt)}</div>
    <div class="bar">
      ${FORMA.email ? `<a class="btn pri" href="mailto:${encodeURIComponent(FORMA.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Надіслати поштою</a>` : ''}
      ${navigator.share ? `<button class="btn" id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg> Viber, Telegram…</button>` : ''}
      <button class="btn" id="copy2"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg> Копіювати</button>
    </div></section>`;
  const sh = $('share');
  if (sh) sh.onclick = () => navigator.share({ title: subj, text: msg }).catch(() => {});
  $('copy2').onclick = () => navigator.clipboard.writeText(msg).then(() => toast('Скопійовано'), () => toast('Не вдалося скопіювати'));
};
$('print').onclick = () => window.print();
$('open').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const x = JSON.parse(await file.text());
    if (typeof x !== 'object' || !x) throw 0;
    const clean = {};
    Object.keys(EMPTY).forEach(k => { if (k in x) clean[k] = Array.isArray(EMPTY[k]) ? (Array.isArray(x[k]) ? x[k] : []) : typeof EMPTY[k] === 'boolean' ? !!x[k] : String(x[k] ?? ''); });
    d = Object.assign({}, EMPTY, clean);
    save(d); render(); toast('Файл відкрито');
  } catch (err) { toast('Це не файл реквізитів'); }
  e.target.value = '';
};

render();
</script>
</body>
</html>
